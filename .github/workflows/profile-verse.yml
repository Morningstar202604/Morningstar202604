name: Profile Verse Cards

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-verse
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Impact card (two accounts aggregated)
        uses: Morningstar202604/profile-verse/components/impact-card@v1
        with:
          users: Morningstar202604,X33834
          output: assets/profile-verse/impact-card.svg

      - name: Impact card (light)
        uses: Morningstar202604/profile-verse/components/impact-card@v1
        with:
          users: Morningstar202604,X33834
          theme: light
          output: assets/profile-verse/impact-card-light.svg

      - name: Year review
        uses: Morningstar202604/profile-verse/components/year-review-card@v1
        with:
          user: Morningstar202604
          output: assets/profile-verse/year-review-card.svg
          theme: ${{ inputs.theme }}

      - name: Year review (light)
        uses: Morningstar202604/profile-verse/components/year-review-card@v1
        with:
          user: Morningstar202604
          theme: light
          output: assets/profile-verse/year-review-card-light.svg

      - name: Stats card
        uses: Morningstar202604/profile-verse/components/stats-card@v1
        with:
          user: Morningstar202604
          output: assets/profile-verse/stats-card.svg

      - name: Stats card (light)
        uses: Morningstar202604/profile-verse/components/stats-card@v1
        with:
          user: Morningstar202604
          theme: light
          output: assets/profile-verse/stats-card-light.svg

      - name: Streak card
        uses: Morningstar202604/profile-verse/components/streak-card@v1
        with:
          user: Morningstar202604
          output: assets/profile-verse/streak-card.svg

      - name: Streak card (light)
        uses: Morningstar202604/profile-verse/components/streak-card@v1
        with:
          user: Morningstar202604
          theme: light
          output: assets/profile-verse/streak-card-light.svg

      - name: Typing card
        uses: Morningstar202604/profile-verse/components/typing-card@v1
        with:
          phrases: "夜观星象，以代码作舟;与其更好，不如不同;Code under the stars, ship with the dawn"
          output: assets/profile-verse/typing-card.svg

      - name: Typing card (light)
        uses: Morningstar202604/profile-verse/components/typing-card@v1
        with:
          phrases: "夜观星象，以代码作舟;与其更好，不如不同;Code under the stars, ship with the dawn"
          theme: light
          output: assets/profile-verse/typing-card-light.svg

      - name: Contribution grid (3D)
        uses: Morningstar202604/profile-verse/components/contrib-grid-card@v1
        with:
          user: Morningstar202604
          output: assets/profile-verse/contrib-grid-card.svg

      - name: Contribution grid (3D, light)
        uses: Morningstar202604/profile-verse/components/contrib-grid-card@v1
        with:
          user: Morningstar202604
          theme: light
          output: assets/profile-verse/contrib-grid-card-light.svg

      - name: Tech stack card
        uses: Morningstar202604/profile-verse/components/tech-stack-card@v1
        with:
          user: Morningstar202604
          output: assets/profile-verse/tech-stack-card.svg

      - name: Tech stack card (light)
        uses: Morningstar202604/profile-verse/components/tech-stack-card@v1
        with:
          user: Morningstar202604
          theme: light
          output: assets/profile-verse/tech-stack-card-light.svg

      - name: Badge card
        uses: Morningstar202604/profile-verse/components/badge-card@v1
        with:
          user: Morningstar202604
          output: assets/profile-verse/badge-card.svg

      - name: Badge card (light)
        uses: Morningstar202604/profile-verse/components/badge-card@v1
        with:
          user: Morningstar202604
          theme: light
          output: assets/profile-verse/badge-card-light.svg

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/profile-verse
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh profile-verse cards [skip ci]"
            git pull --rebase --autostash origin main || git rebase --abort
            git push || { git fetch origin && git rebase --autostash origin/main && git push; }
          fi
